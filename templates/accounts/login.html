{% extends 'base.html' %}
{% block content %}
<div class="col-md-4 mx-auto">
  <h3 class="mb-3">Log in</h3>
  <form method="post">
    {% csrf_token %}
    {% for e in form.non_field_errors %}<div class="alert alert-danger">{{ e }}</div>{% endfor %}
    <div class="mb-3"><label class="form-label">Email</label>{{ form.username }}</div>
    <div class="mb-3"><label class="form-label">Password</label>{{ form.password }}</div>
    <button class="btn btn-primary w-100">Log in</button>
  </form>
  <p class="mt-3"><a href="{% url 'signup' %}">Create account</a></p>
</div>
{% endblock %}
