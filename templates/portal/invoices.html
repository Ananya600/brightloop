{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">My invoices</h3>
<div class="table-responsive"><table class="table table-hover bg-white">
  <thead><tr><th>Number</th><th>Due</th><th>Total</th><th>Status</th></tr></thead>
  <tbody>{% for i in invoices %}
    <tr><td><a href="{% url 'my_invoice' i.pk %}">{{ i.number }}</a></td><td>{{ i.due_date }}</td><td>{{ i.total }}</td>
    <td>{% if i.is_overdue %}<span class="badge bg-danger">Overdue</span>{% else %}<span class="badge bg-secondary">{{ i.get_status_display }}</span>{% endif %}</td></tr>
  {% empty %}<tr><td colspan="4" class="text-center text-muted">No invoices yet.</td></tr>{% endfor %}</tbody>
</table></div>
{% endblock %}
