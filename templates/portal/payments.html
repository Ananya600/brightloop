{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">My payments</h3>
<div class="table-responsive"><table class="table bg-white">
  <thead><tr><th>Date</th><th>Invoice</th><th>Method</th><th>Amount</th></tr></thead>
  <tbody>{% for p in payments %}<tr><td>{{ p.payment_date }}</td><td><a href="{% url 'my_invoice' p.invoice.pk %}">{{ p.invoice.number }}</a></td><td>{{ p.get_method_display }}</td><td>{{ p.amount }}</td></tr>
  {% empty %}<tr><td colspan="4" class="text-center text-muted">No payments yet.</td></tr>{% endfor %}</tbody>
</table></div>
{% endblock %}
